# ============================================================
#  render.yaml — Render Blueprint for Jesus The Counselor Cavite
#
#  Deploys the WHOLE app as a single service on one origin:
#    • one free PostgreSQL database
#    • one Node web service that:
#        - builds the React frontend (dist/)
#        - syncs the DB schema (prisma db push) and seeds it
#        - runs the Express API, which ALSO serves the built frontend
#
#  Serving API + frontend from one origin keeps the auth cookies
#  working without cross-site tweaks and needs no CORS for the app.
#
#  HOW TO USE: push this repo to GitHub, then in Render click
#  "New +" → "Blueprint" and point it at the repo. Render reads this
#  file, creates the database + service, and asks you to fill in the
#  values marked `sync: false` (your admin email + password).
#  See docs/DEPLOY-RENDER.md for the full walkthrough.
# ============================================================

databases:
  - name: jtc-db
    databaseName: jtc
    user: jtc
    plan: free
    region: singapore # MUST match the web service region, else the
                      # internal DB hostname is unreachable (P1001).
                      # Singapore = closest to the Philippines (low latency).

services:
  - type: web
    name: jtc-website
    runtime: node
    plan: free
    region: singapore # Closest region to the Philippines. MUST match
                      # jtc-db's region so the internal DB hostname is
                      # reachable at runtime.
    healthCheckPath: /api/health
    # --include=dev is required: Render sets NODE_ENV=production, which
    # would otherwise make `npm install` skip vite/prisma/tsx (all needed
    # to build and run). We run TS directly with tsx and skip `tsc` so a
    # stray type error can never block a deploy.
    #
    # IMPORTANT: the DB is NOT reachable during the build (Render's build
    # pipeline has no private-network access). So the build only installs
    # deps, generates the Prisma client, and builds the frontend. The
    # schema sync + seed run in startCommand, where the DB IS reachable.
    # Both are idempotent, so re-running them on each start/cold-wake is safe.
    buildCommand: >-
      npm install --include=dev &&
      npx prisma generate &&
      npx vite build
    startCommand: >-
      npx prisma db push --accept-data-loss &&
      npx tsx prisma/seed.ts &&
      npx tsx server/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jtc-db
          property: connectionString
      # Auto-generated strong secrets (different values each) — never in git.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Frontend build flags (baked into dist/ at build time).
      # Same-origin API, so the default base path "/api" is correct.
      - key: VITE_USE_MOCK_DATA
        value: "false"
      # First admin account — Render will prompt you for these on deploy.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Church Admin
